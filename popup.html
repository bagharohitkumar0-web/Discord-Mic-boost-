<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
width: 300 px;
font-family: -apple-system, Segoe UI, Roboto, sans-serif;
padding: 12 px;
background: #1e1f22;
color: #e3e5e8;
}
h1 {
font-size: 15 px;
margin: 0 0 10 px;
color: #fff;
}
label {
font-size: 12 px;
color: #b5bac1;
display: block;
margin-top: 10 px;
}
textarea {
width: 100 %;
height: 100 px;
box-sizing: border-box;
background: #2b2d31;
color: #e3e5e8;
border: 1 px solid #3f4147;
border-radius: 6 px;
padding: 8 px;
font-size: 11 px;
font-family: monospace;
resize: vertical;
}
input[type="file"] {
display: none;
}
.file-upload-btn {
display: inline-block;
padding: 6 px 12 px;
background: #4f545c;
color: #fff;
border-radius: 4 px;
cursor: pointer;
font-size: 12 px;
margin-top: 5 px;
}
#apply {
width: 100 %;
background: #5865F2;
color: #fff;
border: none;
padding: 10 px;
border-radius: 6 px;
cursor: pointer;
font-size: 14 px;
margin-top: 15 px;
font-weight: 600;
}
#gainVal {
float: right;
font-size: 13 px;
font-weight: 600;
}
.row {
display: flex;
justify-content: space-between;
align-items: center;
}
</style>
</head>
<body>
<h1>Mic EQ Boost - Discord</h1>
<div class="row">
<label for="extraBoost">Extra boost</label>
<span id="gainVal">30 dB</span>
</div>
<input type="range" id="extraBoost" min="0" max="30" step="1" value="30" style="width: 100%">
<label>Upload AutoEQ / EQ APO .txt</label>
<label for="fileInput1" class="file-upload-btn">Choose File</label>
<input type="file" id="fileInput1" accept=".txt">
<span id="fileName1" style="font-size: 11px; margin-left: 10px;">No file chosen</span>
<label>Upload Additional EQ APO .txt</label>
<label for="fileInput2" class="file-upload-btn">Choose File</label>
<input type="file" id="fileInput2" accept=".txt">
<span id="fileName2" style="font-size: 11px; margin-left: 10px;">No file chosen</span>
<label>...or paste filter text</label>
<textarea id="filterText" placeholder="Preamp: -6.6 dB&#10;Filter 1: ON PK Fc 105 Hz Gain -2.5 dB Q 1.41"></textarea>
<label>...or paste VST Plugin details</label>
<textarea id="vstDetails" placeholder="VST Plugin: Library.dll ChunkData..."></textarea>
<button id="apply">Apply</button>
<script src="popup.js"></script>
</body>
</html>
